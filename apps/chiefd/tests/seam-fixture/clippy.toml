# chiefd seam configuration — the design record.
#
# The seam this file defends: SQLite connections may only be opened by the
# per-company writer actor (`chiefd_core::store`), and the filesystem may only
# be touched by the host executor (`chiefd_host`). Anywhere else, opening a
# connection or writing a file re-creates the multi-writer world chiefd exists
# to delete. clippy.toml is workspace-global, so the two legitimate owners
# carry a narrow, commented `#[allow(clippy::disallowed_methods)]` at the exact
# call site — which makes every such site greppable and reviewable.
#
# `unwrap_used` / `expect_used` / `panic` are denied in Cargo.toml
# `[workspace.lints.clippy]`; the three `allow-*-in-tests` switches below keep
# test code readable without weakening production builds.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

disallowed-methods = [
    { path = "rusqlite::Connection::open", reason = "only chiefd_core::store may open a company connection — one writer thread per chief.db (README §5.2)" },
    { path = "rusqlite::Connection::open_with_flags", reason = "only chiefd_core::store may open a company connection (README §5.2)" },
    { path = "std::fs::write", reason = "filesystem effects belong to chiefd_host::executor, inside a host transaction (README §5.6)" },
    { path = "std::fs::remove_file", reason = "filesystem effects belong to chiefd_host::executor, inside a host transaction (README §5.6)" },
    { path = "std::fs::rename", reason = "publish-by-rename is a HostExecutor step, never an ad-hoc call (README §5.6)" },
    { path = "std::thread::sleep", reason = "all waiting flows through the injected Clock so tests never sleep (TESTING.md §4.2)" },
    { path = "tokio::time::sleep", reason = "all waiting flows through the injected Clock so tests never sleep (TESTING.md §4.2)" },
]

disallowed-types = [
    { path = "std::fs::OpenOptions", reason = "file handles belong to chiefd_host::executor (README §5.6)" },
    { path = "std::fs::File", reason = "file handles belong to chiefd_host::executor (README §5.6)" },
]
